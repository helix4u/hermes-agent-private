<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hermes Sidecar Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Hermes Agent</p>
        <h1>Sidecar settings</h1>
        <p class="subhead">Configure bridge and default behavior here. Chat stays clean in the side panel.</p>
      </header>

      <section class="card">
        <div class="section-head">
          <div>
            <h2>Bridge</h2>
            <p class="section-copy">How this extension reaches your local Hermes gateway.</p>
          </div>
          <button id="health-button" class="ghost-button" type="button">Check bridge</button>
        </div>
        <label class="field">
          <span class="field-label">Bridge URL</span>
          <input id="bridge-url" type="url" spellcheck="false">
        </label>
        <label class="field">
          <span class="field-label">Bridge token</span>
          <input id="bridge-token" type="password" spellcheck="false" placeholder="Paste ~/.hermes/browser_bridge_token">
        </label>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <h2>Defaults</h2>
            <p class="section-copy">Default checkboxes for new turns in the sidecar.</p>
          </div>
        </div>
        <label class="checkbox-row">
          <input id="share-page-by-default" type="checkbox">
          <span>Use the current page by default</span>
        </label>
        <label class="checkbox-row">
          <input id="include-transcript" type="checkbox">
          <span>Include YouTube transcript by default</span>
        </label>
      </section>

      <section class="card actions-card">
        <button id="save-settings-button" class="primary-button" type="button">Save settings</button>
        <p id="status-text" class="status-text">Waiting for input.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
